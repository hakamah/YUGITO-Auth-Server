services:
  - type: web
    name: yugito-auth
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python yugito_auth_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: YUGITO_PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
